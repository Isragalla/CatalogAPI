name: ProductCatalog CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build API and Tests
        run: dotnet build --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj --no-build --verbosity normal
